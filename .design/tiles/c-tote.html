<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=common.css><style>
:root{--ground:#141110;--raised:#1d1916;--line:#3a322b;--amber:#f2a900;--text:#efe7da;--quiet:#a39a8c;--red:#e04a3a;--blue:#4c86ff}
body{background:var(--ground);color:var(--text)}
.bar{display:flex;gap:16px;padding:12px 28px;background:#000;font:600 13px 'IBM Plex Mono';color:var(--amber)}
.hero{padding:40px 28px}
h1{font:800 clamp(48px,6.5vw,104px)/.9 'Big Shoulders Display';text-transform:uppercase;max-width:15ch}
.tote{margin-top:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{background:#000;border:1px solid var(--line);padding:14px}.t small{color:var(--quiet);font:500 12px 'IBM Plex Mono'}
.t div{font:600 44px 'IBM Plex Mono';color:var(--amber)}
</style></head><body>
<div class=bar><span>RINGSIDE TOTE</span><span>● LIVE</span><span>R2 00:41</span><span>TICK 000412</span></div>
<div class=hero><h1>Every price is as fresh as the last punch</h1>
<div class=tote><div class=t><small>RED BID</small><div>0.60</div></div><div class=t><small>RED ASK</small><div>0.62</div></div><div class=t><small>BLUE BID</small><div>0.38</div></div><div class=t><small>BLUE ASK</small><div>0.40</div></div></div></div>
</body></html>
