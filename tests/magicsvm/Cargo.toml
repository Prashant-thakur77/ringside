[package]
name = "ringside-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anchor-lang = "=1.0.2"
ringside = { path = "../../programs/ringside", features = ["no-entrypoint"] }
ringside-sim = { path = "../../crates/ringside-sim" }
ringside-fixed = { path = "../../crates/ringside-fixed" }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "access-control"] }
magicsvm = "0.3.1"
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
