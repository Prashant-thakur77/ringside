[workspace]
resolver = "2"
members = [
    "crates/ringside-fixed",
    "crates/ringside-sim",
    "crates/ringside-wasm",
    "crates/ringside-py",
    "programs/ringside",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
