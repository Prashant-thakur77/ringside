[package]
name = "ringside-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ringside-fixed = { path = "../crates/ringside-fixed" }

[[bin]]
name = "trade"
path = "fuzz_targets/trade.rs"
test = false
doc = false
bench = false
