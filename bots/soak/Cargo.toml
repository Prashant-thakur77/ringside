[package]
name = "ringside-soak"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soak test: K concurrent spectators × M trades against a live Ringside match"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
anyhow = "1"
